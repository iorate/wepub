[package]
name = "wepub-core"
version = "1.1.0"
description = "Library for publishing browser extensions to Chrome Web Store, Firefox Add-ons, and Edge Add-ons"
readme = "README.md"
keywords = ["browser-extension", "chrome", "firefox", "edge"]
categories = ["api-bindings", "web-programming::http-client"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-io.workspace = true
bon.workspace = true
isahc.workspace = true
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock.workspace = true

[lints]
workspace = true
