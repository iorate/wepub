[package]
name = "wepub"
version = "1.0.6"
description = "CLI to publish browser extensions to Chrome Web Store, Firefox Add-ons, and Edge Add-ons"
readme = "../../README.md"
keywords = ["browser-extension", "chrome", "firefox", "edge", "cli"]
categories = ["command-line-utilities", "web-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
clap-verbosity-flag = { workspace = true, features = ["tracing"] }
dotenvy.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "io-std", "io-util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true
wepub-core.workspace = true

[lints]
workspace = true
