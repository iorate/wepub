name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: cargo fmt
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: cargo test
        run: cargo test

      - name: Check package.json versions
        run: |
          cargo metadata --format-version 1 --no-deps \
            | jq -re '.packages[] | .name + " " + .version' \
            | while read -r name version; do
                stub="$(jq -re .version "crates/$name/package.json")"
                if [[ "$stub" != "$version" ]]; then
                  echo "::error::$name: Cargo.toml has $version but package.json has $stub"
                  exit 1
                fi
              done

  msrv:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read MSRV
        id: read-msrv
        uses: actions-rust-lang/msrv@983d9d27da8fe8aaa47732160b7a14805004d4b2 # v0.1.3

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ steps.read-msrv.outputs.msrv }}

      - name: cargo check
        run: cargo check

  scripts:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: shellcheck setup/install.sh

  workflows:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run jactionlint
        uses: docker://ghcr.io/jdx/jactionlint:2.6.0@sha256:323474d5999ac01a4712d99a8c21d245b62f79977a1e9cc8795f321142a087d7
        with:
          args: --online
        env:
          GITHUB_TOKEN: ${{ github.token }}

  ci:
    needs:
      - check
      - msrv
      - scripts
      - workflows

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Fail unless every job succeeded
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped'))
        run: exit 1
