# release.yml is autogenerated by cargo-dist; ignore the rules it consistently violates.
rules:
  excessive-permissions:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
  cache-poisoning:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
  use-trusted-publishing:
    ignore:
      - release.yml
