[workspace]
resolver = "3"
members = [
    "crates/wepub",
    "crates/wepub-core",
]

[workspace.package]
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/iorate/wepub"
repository = "https://github.com/iorate/wepub"
authors = ["iorate"]

[workspace.dependencies]
anyhow = "1.0.102"
async-io = "2.6.0"
bon = "3.9.3"
clap = "4.6.1"
clap-verbosity-flag = { version = "3.0.4", default-features = false }
dotenvy = "0.15.7"
isahc = "2.0.1"
jsonwebtoken = "11.0.0"
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = "1.52.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = "1.23.1"
wepub-core = { version = "1.1.0", path = "crates/wepub-core" }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
