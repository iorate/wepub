[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "iorate/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A namespace to use when publishing this package to the npm registry
npm-scope = "@iorate"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "npm"]
# Whether to install an updater program
install-updater = false
# Don't run the release workflow on pull requests
pr-run-mode = "skip"
# Only react to tags like "wepub-v1.0.2"; plain "v1.0.2" tags are created post-announce
tag-namespace = "wepub"
# Create the "v1.0.2" and "v1" tags after the release is published
post-announce-jobs = ["./tag-aliases"]
# Attest build provenance of release artifacts with GitHub Artifact Attestations
github-attestations = true

# Pin GitHub Actions used by the generated release.yml to specific commit SHAs.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/setup-node" = "820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
"actions/attest" = "f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6" # v4.2.0
